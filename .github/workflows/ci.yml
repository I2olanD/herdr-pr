name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mod parses
        run: node --input-type=module --check < mods/pull-request/main.js
      - name: Manifest and keys are JSON
        run: node -e "for (const f of ['mods/pull-request/mod.json', 'keys.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
